name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # One universal2 app (Apple Silicon + Intel) shipped as a DMG.
    #
    # PyQt6 / sip / pyserial wheels are already universal2, but PyQt6-Qt6
    # ships per-arch wheels — which is why v2.4.2's universal attempt
    # crashed on Intel. scripts/fuse_qt_universal.py lipo-merges the x86_64
    # Qt wheel into the installed arm64 one before PyInstaller runs, so
    # every Qt binary in the bundle carries both slices.
    runs-on: macos-latest
    env:
      UPY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
      APP: dist/Videomancer Control.app
    steps:
      - uses: actions/checkout@v5

      - name: Install universal2 Python (python.org)
        run: |
          curl -sSfL -o python.pkg \
            https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
          sudo installer -pkg python.pkg -target /
          lipo -archs "$UPY"

      - name: Install dependencies
        run: |
          "$UPY" -m pip install --upgrade pip
          "$UPY" -m pip install PyQt6 pyserial pyinstaller

      - name: Make Qt universal2
        run: |
          "$UPY" scripts/fuse_qt_universal.py

      - name: Build binary (universal2)
        run: |
          "$UPY" -m PyInstaller --onedir --windowed \
            --name "Videomancer Control" \
            --icon "icon.icns" \
            --target-architecture universal2 \
            --hidden-import serial.tools.list_ports \
            --collect-submodules PyQt6 \
            --add-data "fonts:fonts" \
            main.py

      - name: Verify every binary is universal
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q Mach-O; then
              a=$(lipo -archs "$f" 2>/dev/null)
              case "$a" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "single-arch: $f ($a)"; bad=1;; esac
            fi
          done < <(find "$APP/Contents" -type f -print0)
          exit $bad

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          rm certificate.p12

      - name: Sign the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: Nathaniel Coleman ($APPLE_TEAM_ID)"

          # Sign all nested Mach-O binaries first (inside-out), then the bundle.
          # --deep is deprecated; we walk the tree ourselves.
          find "$APP/Contents" \( -name "*.dylib" -o -name "*.so" \) -print0 \
            | xargs -0 -I {} codesign --force --timestamp --options runtime \
                --sign "$IDENTITY" {}

          # Sign embedded frameworks (Qt, Python)
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -type d -name "*.framework" -print0 \
              | xargs -0 -I {} codesign --force --timestamp --options runtime \
                  --sign "$IDENTITY" {}
          fi

          # Sign all executables in MacOS/ (main + any helpers from onedir)
          find "$APP/Contents/MacOS" -type f -perm +111 -print0 \
            | xargs -0 -I {} codesign --force --timestamp --options runtime \
                --entitlements entitlements.plist \
                --sign "$IDENTITY" {}

          codesign --force --timestamp --options runtime \
            --entitlements entitlements.plist \
            --sign "$IDENTITY" \
            "$APP"

          # Verify hardened runtime is enabled and signature is valid
          codesign --verify --verbose=2 "$APP"
          codesign -dv --entitlements - "$APP"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" notarize.zip

          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP" || true

      - name: Build, sign and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: Nathaniel Coleman ($APPLE_TEAM_ID)"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Videomancer Control" -srcfolder dmg \
            -ov -format UDZO VideomancerControl_macOS.dmg
          codesign --force --timestamp --sign "$IDENTITY" VideomancerControl_macOS.dmg
          xcrun notarytool submit VideomancerControl_macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple VideomancerControl_macOS.dmg

      - name: Create zip for the in-app updater
        run: |
          # The in-app updater (2.6+) downloads this; it holds the same
          # universal app as the DMG. (No separate Intel asset: the pre-2.6
          # updaters that looked for one never worked.)
          cd dist
          ditto -c -k --keepParent "Videomancer Control.app" ../VideomancerControl_macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            VideomancerControl_macOS.dmg
            VideomancerControl_macOS.zip


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt6 pyserial pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name "Videomancer Control" --icon "icon.ico" --hidden-import serial.tools.list_ports --add-data "fonts;fonts" main.py

      - name: Create zip
        run: |
          Compress-Archive -Path "dist\Videomancer Control.exe" -DestinationPath VideomancerControl_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: VideomancerControl_Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Videomancer Control ${{ github.ref_name }}
          body: |
            ## Videomancer Control ${{ github.ref_name }}

            Desktop companion app for the LZX Industries Videomancer.

            ### New in 2.7
            - **Program Library tab** — browse LZX's official and community program libraries (every release), see what's on your SD card, and install, update or remove programs over USB. Downloads are checksum-verified; the app picks a library your firmware can run, warns before newer-firmware libraries, older versions, or running out of space.
            - **MY PROGRAMS** — your own programs on the card, with whether the Videomancer loaded them.
            - **70-program limit shown** — the Videomancer loads at most 70 programs from the SD card; the Library tab shows how many are skipped.
            - **Purple / Amber theme** toggle on the System tab.
            - **Favorite stars** at the end of each program row; **LZX Resources** section with LZX Connect, the manual and more.
            - Time / Space / Slope knobs lock while a parameter's modulation source is Disabled (the firmware ignores them then).

            ### Earlier in 2.6.x
            - Universal Mac DMG, working in-app updates, real parameter names and units, reliable control sync, Time/Space/Slope fix, firmware check, device health, Randomize/Undo, keyboard shortcuts.

            ### Downloads
            - **macOS (Apple Silicon + Intel)**: `VideomancerControl_macOS.dmg` — open it and drag the app to Applications.
            - **Windows**: `VideomancerControl_Windows.zip`

            The macOS app is signed and notarized by Apple — no security warnings.
            Already installed? The in-app updater will pick this up automatically.

            ### Run from source
            ```
            pip install PyQt6 pyserial
            python main.py
            ```
          files: |
            VideomancerControl_macOS.dmg
            VideomancerControl_macOS.zip
            VideomancerControl_Windows.zip
          draft: false
          prerelease: false
